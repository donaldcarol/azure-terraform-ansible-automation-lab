---
- name: Deploy custom web page
  hosts: webservers
  become: true

  tasks:
    - name: Deploy custom index.html
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Terraform and Ansible Lab</title>
          </head>
          <body>
            <h1>Terraform + Ansible Automation Lab</h1>
            <p>This VM was provisioned with Terraform and configured with Ansible.</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: '0644'
